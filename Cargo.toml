[workspace]
members = [
    "packages/sqlite-web-core",
    "packages/sqlite-web"
]
exclude = [
    "lib/rain.math.float",
    "vendor/sqlite-wasm-rs"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
homepage = "https://github.com/rainlanguage/sqlite-wasm-rs-test"

[workspace.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "BroadcastChannel",
    "MessageEvent",
    "DedicatedWorkerGlobalScope",
    "Navigator",
    "Window",
    "Location",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemHandle",
    "FileSystemRemoveOptions",
    "FileSystemGetDirectoryOptions",
    "DomException",
    "Response",
    "AbortController",
    "AbortSignal",
    "Request",
    "RequestInit",
    "ReadableStream",
    "ReadableStreamDefaultReader"
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
serde-wasm-bindgen = "0.6"
uuid = { version = "1.0", features = ["v4", "js"] }
console_error_panic_hook = "0.1"
base64 = "0.21"
sqlite-wasm-rs = { version = "=0.3.0", default-features = false, features = ["precompiled"] }
alloy = { version = "1.0.9", default-features = false, features = ["sol-types", "json", "json-abi"] }
thiserror = "2.0.12"
proptest = "1.7.0"
revm = { version = "36", default-features = false, features = ["portable", "std", "tracer"] }
wasm-bindgen-utils = "0.1.2"
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true

[patch.crates-io]
sqlite-wasm-rs = { path = "vendor/sqlite-wasm-rs" }
